<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% if push_key %}<meta name="vapid-key" content="{{ push_key }}">{% endif %}
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#cf432a">
  <title>{% block title %}Breakouts{% endblock %}</title>
  <link rel="stylesheet" href="/static/fonts.css?v={{ css_v }}">
  <link rel="stylesheet" href="/static/styles.css?v={{ css_v }}">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/qrcode.min.js?v={{ js_v }}" defer></script>
  <script src="/static/app.js?v={{ js_v }}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' data-page="{% block page %}{% endblock %}">
  <header class="masthead">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">❡</span>
      <span class="brand-name">Breakouts</span>
    </a>
    <nav class="masthead-nav">
      {% if session %}
        {% if session.is_admin %}<a href="/admin">console</a>{% endif %}
        <a href="/app">rate</a><a href="/published">schedule</a>
        <a href="/logout" class="muted">exit</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
